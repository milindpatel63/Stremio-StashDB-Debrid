services:
  stremio-stashdb:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: stremio-stashdb-addon

    restart: unless-stopped

    ports:
      - "${PORT:-7070}:${PORT:-7070}"

    # Loads all variables from .env (copy from .env.example). No need to list each key here.
    env_file:
      - .env

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 7070) + '/manifest.json', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
